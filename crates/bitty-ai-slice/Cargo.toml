[package]
name = "bitty-ai-slice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Integration harness: real bitty-ai-runtime x real bitty-ipc (pressure test, CTX-0407)"
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
bitty-ai-runtime = { path = "../bitty-ai-runtime" }
# AI-0186 (DEC-0008 step 5): session plane extracted from this crate as a pure
# move. The dependency direction is slice -> session, never the reverse.
bitty-ai-session = { path = "../bitty-ai-session" }
bitty-ipc = { git = "https://github.com/bitty-terminal/bitty", rev = "cfeffa2d8e1387029850940af2b64877dbfbe25f" }
# CTX-0916 S6 registration (AI-0172, DEC-0100): the slice contributes the AI
# capability families, role ceilings, and provider-credential adapter against
# the real Core typed catalogs. Pinned to the S5 merge rev `271d662b`
# (full SHA below, same convention as the `bitty-ipc` pin above).
# `bitty-ai-runtime` stays std-only; only the slice takes this dependency.
bitty-package = { git = "https://github.com/bitty-terminal/bitty", rev = "271d662ba7445f0c963d86f01df63a75bcd81fa1" }
bitty-plugin-host = { git = "https://github.com/bitty-terminal/bitty", rev = "271d662ba7445f0c963d86f01df63a75bcd81fa1" }
# AI-0121 snapshot-ingest experiment (slice-only): maintained SHA-256 (`sha2`)
# plus lowercase hex (`hex`) for digest verification, and minimal field
# extraction (`serde_json`) for the version gate and the L0 summary. None of
# these cross the runtime boundary: `bitty-ai-runtime` stays std-only.
hex = { version = "=0.4.3" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
sha2 = { version = "=0.11.0" }
# R6 journal prototype (AI-0049, experimental, slice-only). `bundled` compiles
# vendored SQLite 3.53.2; default features off drops the wasm-only subtree and
# the statement cache. Dependency review: PX-0298 on AI-0049.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
# AI-0156 transport-adapter prototype (slice-only): bitty-network-api consumer
# vocabulary for TurnRequest mapping into Request with budget_bytes, timeout_ms,
# and secret redaction.
bitty-network-api = { git = "https://github.com/bitty-terminal/bitty-network", rev = "2aa466387db8e7b2092ce31a09c51040e38ec3e0" }
# AI-0259 slice experiment (slice-only): real SPKI provider via the CTX-0073
# peer-leaf accessor. Direct `bitty-network-tls` edge (lightest: no reqwest,
# no backend), same repo+rev as `bitty-network-api` above. `bitty-ai-mcp` stays
# untouched: only the slice takes these edges.
bitty-network-tls = { git = "https://github.com/bitty-terminal/bitty-network", rev = "2aa466387db8e7b2092ce31a09c51040e38ec3e0" }
# AI-0259 slice experiment (slice-only): the `PeerKeyProvider` trait plus
# `FakePeerKeys` shape reference live in `bitty-ai-mcp`; the slice implements
# the trait, never the reverse (no cycle: mcp depends only on the runtime).
bitty-ai-mcp = { path = "../bitty-ai-mcp" }

[dev-dependencies]
# AI-0218 live-probe only (#[ignore]d OpenRouter probe in network_adapter
# tests): the real HTTPS NetworkService. Test-only, so it never enters the
# shipped graph; same repo+rev as bitty-network-api above. `http` enables the
# reqwest/rustls backend, `proxy` lets the probe inherit standard proxy env
# (HTTPS_PROXY/NO_PROXY) in sandboxed runs. bitty-ai-runtime stays std-only.
bitty-network = { git = "https://github.com/bitty-terminal/bitty-network", rev = "2aa466387db8e7b2092ce31a09c51040e38ec3e0", features = ["http", "proxy"] }
