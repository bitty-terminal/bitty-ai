name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.98.1
          --profile minimal
          --component rustfmt
          --component clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Lint GitHub Actions workflows
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}:/repo"
          --workdir /repo
          docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  msrv:
    name: MSRV 1.85 check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install MSRV toolchain 1.85
        run: >-
          rustup toolchain install 1.85
          --profile minimal
          --component clippy

      - name: Check MSRV compilation
        run: cargo +1.85 check --workspace --all-targets --locked

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.98.1
          --profile minimal
          --component clippy

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.98.1
          --profile minimal
          --component clippy

      - name: Check workspace compilation (Windows)
        run: cargo check --workspace --all-targets --locked

  macos:
    name: macOS
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.98.1
          --profile minimal
          --component clippy

      - name: Check workspace compilation (macOS ARM64)
        run: cargo check --workspace --all-targets --locked

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.98.1
          --profile minimal

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Check dependencies (licenses, bans, sources)
        run: cargo deny check

      # cargo-deny and cargo-audit share ~/.cargo/advisory-db; deny populates it
      # so clear before audit to avoid "Refusing to initialize non-empty directory" failure.
      - name: Audit advisories
        run: rm -rf ~/.cargo/advisory-db && cargo audit --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0192

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Install the pinned upstream gitleaks release from shell steps only.
      # The justfile owns the version pin (`gitleaks_version`); this step parses
      # that line so the workflow and local `just secrets` cannot drift, and the
      # release asset names (gitleaks_<version>_linux_x64.tar.gz and
      # gitleaks_<version>_checksums.txt) are verified against the pinned
      # release tag. The tarball sha256 is verified against the published
      # checksum file BEFORE extraction; findings make the job fail.
      - name: Install checksum-verified gitleaks
        run: |
          set -euo pipefail
          version="$(sed -n 's/^gitleaks_version[[:space:]]*:=[[:space:]]*"\([^"]*\)".*/\1/p' justfile)"
          test -n "${version}"
          asset="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location --output "${asset}" "${base}/${asset}"
          curl --fail --silent --show-error --location --output checksums.txt "${base}/gitleaks_${version}_checksums.txt"
          grep " ${asset}\$" checksums.txt > sha256sums.txt
          sha256sum --check --strict sha256sums.txt
          tar --extract --gzip --file "${asset}" gitleaks
          install --mode 0755 --directory "${HOME}/.local/bin"
          install --mode 0755 gitleaks "${HOME}/.local/bin/gitleaks"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Scan Git history for secrets
        run: gitleaks detect --source . --no-banner
