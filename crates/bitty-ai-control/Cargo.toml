[package]
name = "bitty-ai-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Helper-side launch-scoped mutual-certificate control transport and provider-publication state machine"
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# POLICY (AI-0333/AI-0337): this is the separately owned TLS/bootstrap and
# control-state composition boundary, deliberately outside the endpoint
# purity policy. Exactly four edges: the pure IPC contract plus the TLS
# family already resolved in this workspace (same provider, no second TLS
# family):
#
# - rustls: TLS 1.3 server with a custom pinned `ClientCertVerifier`. Default
#   features are off so the shipped build has no TLS 1.2 (`tls12` is a
#   test-only dev-dependency below) and no logging integration. `aws_lc_rs` is
#   the workspace's resolved provider; `std` supplies `Read`/`Write` and
#   `ServerConnection`. The dependency is pinned to the specified 0.23.46
#   release.
# - sha2: SHA-256 over the leaf certificate DER for the Core pin (and for the
#   same digest check in the verifier); no other digest use.
# - zeroize: owned manifest/private-key buffers are erased on drop. This covers
#   only owned accessible storage, exactly as the design's cooperative-cleanup
#   framing allows; provider/library copies are out of scope.
#
# - bitty-ipc-api: the pure provider-publication record contract (AI-0336
#   pin, same revision as the endpoint edge). The control record header,
#   typed bodies, closed enums, canonical payload, constants, and codec are
#   owned there; this crate reuses them and adds no second wire format.
#
# `rustls-pki-types` is not a direct edge: its `CertificateDer`,
# `PrivateKeyDer`, and `DistinguishedName` types are used through rustls's
# re-export. No rcgen, no X.509 parser, no clock/socket/thread dependency.
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
sha2 = { version = "=0.11.0" }
zeroize = { version = "=1.9.0" }
bitty-ipc-api = { git = "https://github.com/bitty-terminal/bitty-ipc", rev = "e6a2c0c" }

[dev-dependencies]
# TEST-ONLY: enables rustls's TLS 1.2 code so the refusal test can construct a
# real TLS-1.2-only client. It does not change the shipped edge above; the
# server config always pins `rustls::version::TLS13` and the test asserts the
# server refuses the TLS-1.2 ClientHello.
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
