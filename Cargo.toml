[workspace]
members = [
    "crates/bitty-ai-core",
    # Future crates:
    # - crates/bitty-ai-model-provider
    # - crates/bitty-ai-context-provider
    # - crates/bitty-ai-agent
    # - crates/bitty-ai-tool-bus
    # - crates/bitty-ai-workspace
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Bitty AI subsystem - ModelProvider, ContextProvider, Agent, and Tool Bus"
license = "MIT"
repository = "https://github.com/bitty-terminal/bitty-ai"
keywords = ["ai", "agent", "llm", "model-provider", "bitty"]
categories = ["development-tools"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
