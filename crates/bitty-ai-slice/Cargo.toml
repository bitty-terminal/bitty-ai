[package]
name = "bitty-ai-slice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Integration harness: real bitty-ai-runtime x real bitty-ipc (pressure test, CTX-0407)"
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
bitty-ai-runtime = { path = "../bitty-ai-runtime" }
# AI-0186 (DEC-0008 step 5): session plane extracted from this crate as a pure
# move. The dependency direction is slice -> session, never the reverse.
bitty-ai-session = { path = "../bitty-ai-session" }
bitty-ipc = { git = "https://github.com/bitty-terminal/bitty", rev = "cfeffa2d8e1387029850940af2b64877dbfbe25f" }
# CTX-0916 S6 registration (AI-0172, DEC-0100): the slice contributes the AI
# capability families, role ceilings, and provider-credential adapter against
# the real Core typed catalogs. Pinned to the S5 merge rev `271d662b`
# (full SHA below, same convention as the `bitty-ipc` pin above).
# `bitty-ai-runtime` stays std-only; only the slice takes this dependency.
bitty-package = { git = "https://github.com/bitty-terminal/bitty", rev = "271d662ba7445f0c963d86f01df63a75bcd81fa1" }
bitty-plugin-host = { git = "https://github.com/bitty-terminal/bitty", rev = "271d662ba7445f0c963d86f01df63a75bcd81fa1" }
# AI-0121 snapshot-ingest experiment (slice-only): maintained SHA-256 (`sha2`)
# plus lowercase hex (`hex`) for digest verification, and minimal field
# extraction (`serde_json`) for the version gate and the L0 summary. None of
# these cross the runtime boundary: `bitty-ai-runtime` stays std-only.
hex = { version = "=0.4.3" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
sha2 = { version = "=0.11.0" }
# R6 journal prototype (AI-0049, experimental, slice-only). `bundled` compiles
# vendored SQLite 3.53.2; default features off drops the wasm-only subtree and
# the statement cache. Dependency review: PX-0298 on AI-0049.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
# AI-0156 transport-adapter prototype (slice-only): bitty-network-api consumer
# vocabulary for TurnRequest mapping into Request with budget_bytes, timeout_ms,
# and secret redaction.
bitty-network-api = { git = "https://github.com/bitty-terminal/bitty-network", rev = "f3c313244667e5dca910b4f7cd8e9d9447dce9a7" }
